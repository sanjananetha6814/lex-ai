user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens   off;

    # Rate limiting zone for authentication endpoints: 5 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=auth_login_limit:10m rate=5r/m;

    # General API rate limiting zone for DDoS/burst mitigation
    limit_req_zone $binary_remote_addr zone=api_general_limit:10m rate=50r/s;

    include /etc/nginx/conf.d/*.conf;
}

