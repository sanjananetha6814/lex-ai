upstream backend_api {
    server api:8000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP Server (Port 80) - Enforce HTTPS Redirection
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME challenge path for automated SSL certificates (Let's Encrypt / Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Permanent 301 redirection to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS Server (Port 443) - SSL Termination & Reverse Proxy
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # SSL Certificates
    ssl_certificate /etc/nginx/ssl/lexai.crt;
    ssl_certificate_key /etc/nginx/ssl/lexai.key;

    # Secure TLS Protocols & Ciphers (TLS 1.2 and TLS 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # SSL Session Optimization
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Production Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Body Size Limitation (supports up to 20MB document uploads)
    client_max_body_size 25M;

    # Custom JSON 429 response body when rate limits are exceeded
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":true,"status_code":429,"message":"Too many login attempts. Please try again later."}';
    }

    # Authentication Route Rate Limiting (Protects /api/auth/login across all workers)
    location /api/auth/login {
        limit_req zone=auth_login_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sanitize and strictly control forwarded proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # General API Routes & Static/Web Requests
    location / {
        limit_req zone=api_general_limit burst=100 nodelay;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Sanitize and strictly control forwarded proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}

